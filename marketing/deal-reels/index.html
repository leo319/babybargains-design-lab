<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Baby Bargains — Deal Reel</title><script src="assets/gsap.min.js"></script><script src="deals.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:sans-serif;background:#E8F0EC}#deal-reel{position:relative;width:100%;height:100%;overflow:hidden;color:#203D35;background:#E8F0EC}.scene{position:absolute;inset:0}.inside{position:absolute;inset:0;background:#E8F0EC}.brand{position:absolute;left:78px;top:165px;display:flex;align-items:center;gap:18px;font-size:36px;font-weight:700;color:#3D7A6A}.brand img{width:60px;height:60px}.eyebrow{position:absolute;top:280px;left:80px;font-size:28px;font-weight:700;letter-spacing:4px;text-transform:uppercase}.intro-title{position:absolute;left:76px;top:370px;font-size:104px;line-height:1.04;font-weight:800;letter-spacing:-5px}.intro-title div:last-child{color:#3D7A6A}.collage{position:absolute;top:670px;left:95px;display:grid;grid-template-columns:380px 380px;gap:28px}.mini{height:290px;background:white;border-radius:32px;padding:20px;box-shadow:0 12px 26px #203D3509;display:flex;align-items:center;justify-content:center}.mini img{width:100%;height:100%;object-fit:contain}.intro-offer{position:absolute;top:1340px;left:80px;font-size:57px;font-weight:800}.intro-offer small{display:block;font-size:29px;font-weight:400;margin-top:15px}.foot{position:absolute;left:80px;top:1590px;width:850px;font-size:29px;display:flex;justify-content:space-between;gap:25px;color:#3D7A6A}.discount{position:absolute;top:355px;left:78px;font-size:151px;line-height:1;font-weight:800;letter-spacing:-7px;color:#3D7A6A}.photo{position:absolute;left:80px;top:570px;width:830px;height:480px;background:white;border:2px solid #d4e3dc;border-radius:40px;padding:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 45px #203D3510}.photo img{width:100%;height:100%;object-fit:contain}.product-name{position:absolute;left:80px;top:1110px;width:830px;font-size:54px;line-height:1.1;font-weight:700;letter-spacing:-1px}.old{position:absolute;left:83px;top:1270px;font-size:39px;color:#52665E}.old span{text-decoration:line-through}.price{position:absolute;left:75px;top:1330px;font-size:116px;line-height:1.1;font-weight:800;letter-spacing:-5px}.count{background:#0EA5E9;color:#16364A;border-radius:30px;padding:10px 20px;font-weight:700}.alt .inside{background:#F4F7F5}.summary-title{position:absolute;left:80px;top:330px;font-size:91px;line-height:1.08;font-weight:800;letter-spacing:-4px}.rows{position:absolute;top:610px;left:80px;width:830px;display:grid;gap:22px}.row{height:180px;padding:22px;background:white;border-radius:25px;display:flex;align-items:center;gap:22px}.row img{width:150px;height:132px;object-fit:contain}.row .short{font-size:26px;line-height:1.18;width:370px;font-weight:700}.row .amount{font-size:39px;font-weight:800;color:#3D7A6A;white-space:nowrap}.closing .inside{background:#3D7A6A;color:#fff}.closing .brand{color:white}.end-logo{position:absolute;left:430px;top:420px;width:150px;height:150px}.end-title{position:absolute;top:660px;left:80px;width:850px;font-size:104px;line-height:1.06;font-weight:800;letter-spacing:-4px}.button{position:absolute;top:1050px;left:80px;padding:34px 50px;border-radius:80px;background:#0EA5E9;color:#16364A;font-size:44px;font-weight:800}.end-url{position:absolute;top:1210px;left:80px;font-size:44px}.bio{position:absolute;top:1310px;left:80px;font-size:33px;color:#E8F0EC}.note{position:absolute;top:1590px;left:80px;width:850px;font-size:25px;color:#E8F0EC}
</style></head><body><div id="deal-reel" data-composition-id="deal-reel" data-start="0" data-duration="16" data-width="1080" data-height="1920"><audio id="music" src="assets/music.mp3" data-start="0" data-duration="16" data-track-index="8"></audio></div><script>
const d=window.DEAL_REEL,root=document.getElementById('deal-reel');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo='<div class="brand"><img src="assets/babybargainslogo.svg" alt="Baby Bargains logo">baby bargains</div>';
const photo=p=>`<img src="${esc(p.image)}" alt="${esc(p.name)}">`;
function scene(id,start,duration,content,cl=''){const el=document.createElement('div');el.id=id;el.className='scene clip '+cl;el.dataset.start=start;el.dataset.duration=duration;el.dataset.trackIndex=1;el.innerHTML='<div class="inside" id="'+id+'-inside">'+logo+content+'</div>';root.appendChild(el);}
scene('intro',0,2,`<div class="eyebrow">${esc(d.category)} · deal edit</div><div class="intro-title"><div>${esc(d.headline[0])}</div><div>${esc(d.headline[1])}</div></div><div class="collage">${d.products.map(p=>'<div class="mini">'+photo(p)+'</div>').join('')}</div><div class="intro-offer">Up to 50% off<small>Four finds for their little world.</small></div><div class="foot"><span>${esc(d.url)}</span><span>THE DEAL EDIT →</span></div>`);
d.products.forEach((p,i)=>scene('product-'+i,2+i*2.5,2.5,`<div class="eyebrow">${esc(p.brand)} · ${esc(d.category)}</div><div class="discount">${esc(p.discount)}</div><div class="photo">${photo(p)}</div><div class="product-name">${esc(p.name)}</div><div class="old">Was <span>${esc(p.was)}</span></div><div class="price">${esc(p.price)}</div><div class="foot"><span>${esc(d.url)}</span><span class="count">0${i+1} / 04</span></div>`,i%2?'alt':''));
scene('roundup',12,2,`<div class="eyebrow">${esc(d.category)}</div><div class="summary-title">Your next find.<div>For less.</div></div><div class="rows">${d.products.map(p=>'<div class="row">'+photo(p)+'<div class="short">'+esc(p.name)+'</div><div class="amount">'+esc(p.price)+'</div></div>').join('')}</div><div class="foot"><span>All at ${esc(d.url)}</span></div>`);
scene('ending',14,2,`<img class="end-logo" src="assets/babybargainslogo.svg" alt="Baby Bargains logo"><div class="end-title">Little prices.<div>Big discoveries.</div></div><div class="button">${esc(d.cta)} →</div><div class="end-url">${esc(d.url)}</div><div class="bio">Find these deals · Link in bio</div><div class="note">Prices and availability may change.</div>`,'closing');
const tl=gsap.timeline({paused:true});
['intro','product-0','product-1','product-2','product-3','roundup','ending'].forEach((id,i)=>{const starts=[0,2,4.5,7,9.5,12,14],dur=i===0||i>4?2:2.5,at=starts[i];tl.fromTo('#'+id+'-inside',{x:95,opacity:0},{x:0,opacity:1,duration:.23,ease:'power3.out'},at);if(i<6)tl.to('#'+id+'-inside',{x:-60,opacity:0,duration:.14,ease:'power2.in'},at+dur-.14);});
d.products.forEach((p,i)=>{let at=2+i*2.5;tl.fromTo('#product-'+i+' .photo',{scale:.9,y:28},{scale:1,y:0,duration:.4,ease:'back.out(1.15)'},at+.08);tl.fromTo('#product-'+i+' .price',{y:45,opacity:0},{y:0,opacity:1,duration:.25,ease:'power3.out'},at+.22);});
tl.fromTo('.mini',{scale:.8,opacity:0},{scale:1,opacity:1,stagger:.08,duration:.35,ease:'back.out(1.1)'},.08);
tl.fromTo('.row',{x:70,opacity:0},{x:0,opacity:1,stagger:.06,duration:.25,ease:'power2.out'},12.1);
window.__timelines=window.__timelines||{};window.__timelines['deal-reel']=tl;
</script></body></html>
